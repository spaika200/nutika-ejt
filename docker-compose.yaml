version: '3.8'

services:
  app-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOKI_ENABLED=${LOKI_ENABLED:-false}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - ELERING_API_URL=${ELERING_API_URL:-https://dashboard.elering.ee/api/nps/price}
    depends_on:
      redis:
        condition: service_started
    networks:
      - nutika-network
    restart: unless-stopped


  app-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
        - VITE_APP_NAME=${VITE_APP_NAME:-Nutika Elektrivõrgu Juhtimiskeskus}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - app-backend
    networks:
      - nutika-network
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    networks:
      - nutika-network
    restart: unless-stopped

    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  prometheus:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    volumes:
      - promdata:/prometheus
    ports:
      - "9090"
    networks:
      - nutika-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000"
    volumes:
      - grafanadata:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
      - loki
    networks:
      - nutika-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100"
    networks:
      - nutika-network
    restart: unless-stopped

volumes:
  redis-data:
  promdata:
  grafanadata:

networks:
  nutika-network:
    driver: bridge
