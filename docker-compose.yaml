version: '3.8'

services:
  app-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://nutika:nutikapass@postgres:5432/nutikadb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-changeme_in_production}
    depends_on:
      - postgres
      - redis
    networks:
      - nutika-network
    restart: unless-stopped

  app-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - app-backend
    networks:
      - nutika-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=nutika
      - POSTGRES_PASSWORD=nutikapass
      - POSTGRES_DB=nutikadb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nutika-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - nutika-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    ports:
      - "9090:9090"
    networks:
      - nutika-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
      - loki
    networks:
      - nutika-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - nutika-network
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:

networks:
  nutika-network:
    driver: bridge
