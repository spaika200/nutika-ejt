name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Run backend linter
      run: |
        cd backend
        npm run lint 2>/dev/null || echo "Linter not configured"

    - name: Run backend tests
      run: |
        cd backend
        npm run test

    - name: Build backend
      run: |
        cd backend
        npm run build

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend linter
      run: |
        cd frontend
        npm run lint 2>/dev/null || echo "Linter not configured"

    - name: Run frontend tests
      run: |
        cd frontend
        npm run test 2>/dev/null || echo "Tests not configured"

    - name: Build frontend
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_URL: http://api.example.com

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Run npm audit for backend
      run: |
        cd backend
        npm audit --production || true

    - name: Run npm audit for frontend
      run: |
        cd frontend
        npm audit --production || true

  build-docker:
    runs-on: ubuntu-latest
    needs: [ test-backend, test-frontend, security ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build backend Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: false
        tags: nutika-backend:latest

    - name: Build frontend Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: false
        tags: nutika-frontend:latest

